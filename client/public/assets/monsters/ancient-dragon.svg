<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#4c120d"/>
      <stop offset="55%" stop-color="#1f0706"/>
      <stop offset="100%" stop-color="#090202"/>
    </radialGradient>
    <radialGradient id="infernoGlow" cx="50%" cy="62%" r="54%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.72"/>
      <stop offset="32%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="72%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonScale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="darkScale" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="55%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="62%" stop-color="#050101" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050101" stop-opacity="0.76"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#infernoGlow)"/>

  <!-- Volcanic Embers & Heat Sparks -->
  <g fill="#fb923c" opacity="0.85">
    <circle cx="88" cy="140" r="3"/><circle cx="144" cy="96" r="2.2"/>
    <circle cx="424" cy="136" r="3"/><circle cx="386" cy="212" r="2.4"/>
    <circle cx="98" cy="312" r="2.5"/><circle cx="418" cy="340" r="2.2"/>
  </g>

  <!-- Sweeping Ancient Obsidian Dragon Horns & Spined Frill -->
  <g>
    <!-- Primary Sweeping Curved Horns -->
    <path d="M184 156 C134 114, 78 96, 62 48 C108 66, 174 88, 224 134 Z" fill="url(#hornGrad)" stroke="#090706" stroke-width="3"/>
    <path d="M328 156 C378 114, 434 96, 450 48 C404 66, 338 88, 288 134 Z" fill="url(#hornGrad)" stroke="#090706" stroke-width="3"/>
    <!-- Secondary Cheek Horns -->
    <path d="M156 226 L68 206 L124 268 Z" fill="url(#hornGrad)" stroke="#090706" stroke-width="2.5"/>
    <path d="M356 226 L444 206 L388 268 Z" fill="url(#hornGrad)" stroke="#090706" stroke-width="2.5"/>
    <!-- Horn ridges -->
    <path d="M112 88 L128 74 M146 108 L160 94 M400 88 L384 74 M366 108 L352 94" stroke="#78716c" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- Colossal Armored Dragon Neck & Glowing Molten Throat Plates -->
  <g>
    <path d="M88 512 Q112 368 172 308 L340 308 Q400 368 424 512 Z" fill="url(#darkScale)" stroke="#1a0303" stroke-width="3"/>
    <!-- Glowing molten cracks pulsing between neck scales -->
    <path d="M188 368 Q256 392 324 368 M174 416 Q256 442 338 416 M164 464 Q256 492 348 464" fill="none" stroke="#f97316" stroke-width="4" opacity="0.8"/>
    <path d="M196 368 Q256 388 316 368 M182 416 Q256 438 330 416" fill="none" stroke="#fef08a" stroke-width="1.8" opacity="0.85"/>
    <!-- Armored underbelly plates -->
    <path d="M192 350 Q256 372 320 350 L312 378 Q256 396 200 378 Z" fill="#b45309" stroke="#2e0a04" stroke-width="2"/>
    <path d="M182 396 Q256 420 330 396 L320 426 Q256 448 192 426 Z" fill="#9a3412" stroke="#2e0a04" stroke-width="2"/>
    <path d="M172 444 Q256 470 340 444 L330 478 Q256 502 182 478 Z" fill="#7c2d12" stroke="#2e0a04" stroke-width="2"/>
  </g>

  <!-- Armored Crimson Dragon Head, Brow Plates & Snout -->
  <g>
    <!-- Main cranium & jaw silhouette -->
    <path d="M142 214 L178 134 L256 112 L334 134 L370 214 L344 294 L256 346 L168 294 Z" fill="url(#crimsonScale)" stroke="#1f0404" stroke-width="3.5"/>
    <!-- Armored central nasal crest & brow ridges -->
    <polygon points="256,116 286,164 274,254 256,282 238,254 226,164" fill="#b91c1c" stroke="#360606" stroke-width="2.5"/>
    <polygon points="256,134 268,176 256,248 244,176" fill="#ef4444" opacity="0.55"/>
    <!-- Heavy horned brow plates -->
    <polygon points="154,186 238,204 224,226 164,216" fill="url(#darkScale)" stroke="#1c0303" stroke-width="2.5"/>
    <polygon points="358,186 274,204 288,226 348,216" fill="url(#darkScale)" stroke="#1c0303" stroke-width="2.5"/>
    <!-- Smoking nostrils -->
    <ellipse cx="232" cy="264" rx="10" ry="6" fill="#1c0404" transform="rotate(-18 232 264)"/>
    <ellipse cx="280" cy="264" rx="10" ry="6" fill="#1c0404" transform="rotate(18 280 264)"/>
    <circle cx="232" cy="264" r="3" fill="#fb923c"/>
    <circle cx="280" cy="264" r="3" fill="#fb923c"/>
  </g>

  <!-- Blazing Molten Slit Dragon Eyes -->
  <g>
    <polygon points="174,218 234,228 220,244 182,236" fill="#0f0302"/>
    <polygon points="182,222 226,230 216,240 186,234" fill="#facc15"/>
    <ellipse cx="206" cy="231" rx="2.6" ry="8" fill="#1c0404"/>
    <circle cx="209" cy="228" r="1.8" fill="#ffffff"/>

    <polygon points="338,218 278,228 292,244 330,236" fill="#0f0302"/>
    <polygon points="330,222 286,230 296,240 326,234" fill="#facc15"/>
    <ellipse cx="306" cy="231" rx="2.6" ry="8" fill="#1c0404"/>
    <circle cx="309" cy="228" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Fiery Roaring Maw Filled with Molten Flame & Ivory Fangs -->
  <path d="M180 294 Q256 272 332 294 L314 358 Q256 384 198 358 Z" fill="#7c2d12" stroke="#1f0404" stroke-width="3.5"/>
  <!-- Inner white-hot firebreath glow -->
  <ellipse cx="256" cy="332" rx="48" ry="26" fill="#f97316"/>
  <ellipse cx="256" cy="330" rx="30" ry="15" fill="#fef08a"/>
  <ellipse cx="256" cy="328" rx="14" ry="7" fill="#ffffff"/>
  <!-- Massive Dragon Fangs -->
  <g fill="#f5eedc" stroke="#36281c" stroke-width="1.8">
    <polygon points="196,294 208,334 220,296"/>
    <polygon points="316,294 304,334 292,296"/>
    <polygon points="228,292 236,314 244,290"/>
    <polygon points="268,290 276,314 284,292"/>
    <polygon points="214,358 222,332 232,362"/>
    <polygon points="298,358 290,332 280,362"/>
  </g>

  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
