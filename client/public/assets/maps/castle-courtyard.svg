<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1440" width="1920" height="1440">
  <defs>
    <!-- Medieval courtyard cobblestone pattern -->
    <pattern id="courtyardCobble" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#2c2e33"/>
      <g stroke="#1b1d21" stroke-width="1.6">
        <rect x="2" y="2" width="24" height="18" rx="4" fill="#464950"/>
        <rect x="29" y="2" width="22" height="18" rx="4" fill="#3f4248"/>
        <rect x="54" y="2" width="24" height="18" rx="4" fill="#4b4e56"/>
        <rect x="2" y="22" width="16" height="18" rx="4" fill="#3d4046"/>
        <rect x="21" y="22" width="28" height="18" rx="4" fill="#484b52"/>
        <rect x="52" y="22" width="26" height="18" rx="4" fill="#41444a"/>
        <rect x="2" y="42" width="26" height="18" rx="4" fill="#494c54"/>
        <rect x="31" y="42" width="24" height="18" rx="4" fill="#3e4147"/>
        <rect x="58" y="42" width="20" height="18" rx="4" fill="#45484f"/>
        <rect x="2" y="62" width="20" height="16" rx="4" fill="#41444b"/>
        <rect x="25" y="62" width="26" height="16" rx="4" fill="#4a4d54"/>
        <rect x="54" y="62" width="24" height="16" rx="4" fill="#3c3f45"/>
      </g>
    </pattern>

    <!-- Castle rampart stone flagstone -->
    <pattern id="rampartStone" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#4d5159"/>
      <rect x="2" y="2" width="37" height="37" fill="#5e626b" stroke="#2c2f36" stroke-width="2"/>
      <rect x="41" y="2" width="37" height="37" fill="#565a63" stroke="#2c2f36" stroke-width="2"/>
      <rect x="2" y="41" width="37" height="37" fill="#585c66" stroke="#2c2f36" stroke-width="2"/>
      <rect x="41" y="41" width="37" height="37" fill="#626670" stroke="#2c2f36" stroke-width="2"/>
    </pattern>

    <!-- Subtle VTT Grid -->
    <pattern id="castleGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#e2e8f0" stroke-width="0.8" opacity="0.1"/>
    </pattern>

    <!-- Fountain turquoise water -->
    <radialGradient id="fountainWater" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>

    <!-- Dusk street lantern glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c4" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.46"/>
      <stop offset="65%" stop-color="#d97706" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="castleVignette" cx="50%" cy="50%" r="70%">
      <stop offset="58%" stop-color="#07080c" stop-opacity="0"/>
      <stop offset="90%" stop-color="#07080c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#040508" stop-opacity="0.75"/>
    </radialGradient>

    <filter id="castleShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="8" dy="10" stdDeviation="8" flood-color="#07080c" flood-opacity="0.72"/>
    </filter>
    <filter id="stallShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="5" dy="7" stdDeviation="5" flood-color="#07080c" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Courtyard Cobblestone Plaza -->
  <rect width="1920" height="1440" fill="url(#courtyardCobble)"/>

  <!-- Grand Royal Cross-Axis Paved Flagstone Walkways -->
  <g opacity="0.88">
    <rect x="860" y="160" width="200" height="1280" fill="#52555e" stroke="#2c2e34" stroke-width="4"/>
    <rect x="160" y="640" width="1600" height="160" fill="#52555e" stroke="#2c2e34" stroke-width="4"/>
    <!-- Decorative stone circle plaza around central fountain -->
    <circle cx="960" cy="720" r="245" fill="#585b64" stroke="#2d3038" stroke-width="5"/>
    <circle cx="960" cy="720" r="222" fill="none" stroke="#757a85" stroke-width="3" stroke-dasharray="18 10"/>
  </g>

  <!-- Central Ornate Tiered Stone Fountain (960, 720) -->
  <g transform="translate(960, 720)" filter="url(#castleShadow)">
    <!-- Outer octagonal stone basin wall -->
    <polygon points="-115,-48 -48,-115 48,-115 115,-48 115,48 48,115 -48,115 -115,48" fill="#7c808a" stroke="#23262d" stroke-width="4"/>
    <!-- Shimmering water basin -->
    <polygon points="-96,-40 -40,-96 40,-96 96,-40 96,40 40,96 -40,96 -96,40" fill="url(#fountainWater)" stroke="#3b404a" stroke-width="3"/>
    <!-- Water ripples -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#cffafe" stroke-width="1.5" opacity="0.45"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#cffafe" stroke-width="2" opacity="0.6"/>
    <!-- Inner pedestal & stone statue crown -->
    <circle cx="0" cy="0" r="34" fill="#8b909c" stroke="#2b2e36" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#67e8f9" opacity="0.7"/>
    <circle cx="0" cy="0" r="12" fill="#a2a7b3" stroke="#2b2e36" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#ecfeff"/>
  </g>

  <!-- Market Stalls on West Courtyard Side (Crimson & Cream Awnings) -->
  <g transform="translate(360, 380)" filter="url(#stallShadow)">
    <rect x="-95" y="-50" width="190" height="100" rx="4" fill="#991b1b" stroke="#261010" stroke-width="3"/>
    <!-- Striped canvas awning -->
    <rect x="-95" y="-50" width="28" height="100" fill="#e5d5b5"/>
    <rect x="-40" y="-50" width="28" height="100" fill="#e5d5b5"/>
    <rect x="15" y="-50" width="28" height="100" fill="#e5d5b5"/>
    <rect x="70" y="-50" width="25" height="100" fill="#e5d5b5"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#450a0a" stroke-width="3" opacity="0.5"/>
    <!-- Crates beside stall -->
    <rect x="108" y="-36" width="38" height="38" fill="#6e4422" stroke="#211207" stroke-width="2"/>
    <circle cx="126" cy="26" r="18" fill="#5e381b" stroke="#211207" stroke-width="2"/>
  </g>

  <g transform="translate(360, 1020)" filter="url(#stallShadow)">
    <rect x="-95" y="-50" width="190" height="100" rx="4" fill="#166534" stroke="#0d2616" stroke-width="3"/>
    <rect x="-95" y="-50" width="28" height="100" fill="#e6d9bc"/>
    <rect x="-40" y="-50" width="28" height="100" fill="#e6d9bc"/>
    <rect x="15" y="-50" width="28" height="100" fill="#e6d9bc"/>
    <rect x="70" y="-50" width="25" height="100" fill="#e6d9bc"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#052e16" stroke-width="3" opacity="0.5"/>
    <rect x="108" y="4" width="40" height="40" fill="#6e4422" stroke="#211207" stroke-width="2"/>
    <circle cx="126" cy="-22" r="17" fill="#5e381b" stroke="#211207" stroke-width="2"/>
  </g>

  <!-- East Courtyard: Guard Training Area, Blacksmith Stall & Stables -->
  <g transform="translate(1540, 380)" filter="url(#stallShadow)">
    <rect x="-95" y="-50" width="190" height="100" rx="4" fill="#1e3a8a" stroke="#0f172a" stroke-width="3"/>
    <rect x="-95" y="-50" width="28" height="100" fill="#dbeafe"/>
    <rect x="-40" y="-50" width="28" height="100" fill="#dbeafe"/>
    <rect x="15" y="-50" width="28" height="100" fill="#dbeafe"/>
    <rect x="70" y="-50" width="25" height="100" fill="#dbeafe"/>
    <!-- Weapon rack & barrels -->
    <rect x="-140" y="-32" width="22" height="64" fill="#54331b" stroke="#1e1007" stroke-width="2"/>
    <circle cx="-129" cy="54" r="18" fill="#6b4120" stroke="#1e1007" stroke-width="2"/>
  </g>

  <!-- Hay bales, wooden cart & hitching trough SE -->
  <g transform="translate(1520, 1020)" filter="url(#stallShadow)">
    <rect x="-70" y="-42" width="66" height="40" rx="4" fill="#ca9a36" stroke="#523b0c" stroke-width="2.5"/>
    <rect x="8" y="-36" width="64" height="42" rx="4" fill="#b88829" stroke="#523b0c" stroke-width="2.5" transform="rotate(8 40 -15)"/>
    <rect x="-56" y="16" width="110" height="28" rx="4" fill="#4f3018" stroke="#1f1107" stroke-width="2.5"/>
    <rect x="-48" y="22" width="94" height="16" rx="2" fill="#0e7490"/>
  </g>

  <!-- Stone Staircases ascending to Castle Ramparts (West & East) -->
  <g filter="url(#stallShadow)">
    <!-- West stairs -->
    <rect x="160" y="540" width="84" height="80" fill="#565a64" stroke="#22252b" stroke-width="3"/>
    <line x1="176" y1="540" x2="176" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="194" y1="540" x2="194" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="212" y1="540" x2="212" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="230" y1="540" x2="230" y2="620" stroke="#22252b" stroke-width="2"/>
    <!-- East stairs -->
    <rect x="1676" y="540" width="84" height="80" fill="#565a64" stroke="#22252b" stroke-width="3"/>
    <line x1="1692" y1="540" x2="1692" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="1710" y1="540" x2="1710" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="1728" y1="540" x2="1728" y2="620" stroke="#22252b" stroke-width="2"/>
    <line x1="1746" y1="540" x2="1746" y2="620" stroke="#22252b" stroke-width="2"/>
  </g>

  <!-- Massive Castle Curtain Walls & Battlements -->
  <g filter="url(#castleShadow)">
    <!-- North Keep Wall & Grand Steps -->
    <rect x="0" y="0" width="1920" height="160" fill="url(#rampartStone)" stroke="#1b1e24" stroke-width="5"/>
    <!-- Keep arched entry doors -->
    <rect x="860" y="136" width="200" height="32" fill="#4f2e17" stroke="#1a0e06" stroke-width="4"/>
    <line x1="960" y1="136" x2="960" y2="168" stroke="#1a0e06" stroke-width="4"/>
    <!-- West Curtain Wall -->
    <rect x="0" y="160" width="160" height="1120" fill="url(#rampartStone)" stroke="#1b1e24" stroke-width="5"/>
    <!-- East Curtain Wall -->
    <rect x="1760" y="160" width="160" height="1120" fill="url(#rampartStone)" stroke="#1b1e24" stroke-width="5"/>
    <!-- South Curtain Wall & Gatehouse (opening x:840..1080) -->
    <rect x="0" y="1280" width="840" height="160" fill="url(#rampartStone)" stroke="#1b1e24" stroke-width="5"/>
    <rect x="1080" y="1280" width="840" height="160" fill="url(#rampartStone)" stroke="#1b1e24" stroke-width="5"/>

    <!-- Battlement Crenellations (Merlons) along inner edges -->
    <g fill="#7c808c" stroke="#23262e" stroke-width="2.5">
      <rect x="240" y="140" width="60" height="24"/><rect x="360" y="140" width="60" height="24"/>
      <rect x="480" y="140" width="60" height="24"/><rect x="600" y="140" width="60" height="24"/>
      <rect x="720" y="140" width="60" height="24"/><rect x="1140" y="140" width="60" height="24"/>
      <rect x="1260" y="140" width="60" height="24"/><rect x="1380" y="140" width="60" height="24"/>
      <rect x="1500" y="140" width="60" height="24"/><rect x="1620" y="140" width="60" height="24"/>

      <rect x="240" y="1276" width="60" height="24"/><rect x="380" y="1276" width="60" height="24"/>
      <rect x="520" y="1276" width="60" height="24"/><rect x="660" y="1276" width="60" height="24"/>
      <rect x="1200" y="1276" width="60" height="24"/><rect x="1340" y="1276" width="60" height="24"/>
      <rect x="1480" y="1276" width="60" height="24"/><rect x="1620" y="1276" width="60" height="24"/>
    </g>

    <!-- 4 Corner Round Watchtowers -->
    <g>
      <circle cx="110" cy="110" r="105" fill="#6b707c" stroke="#1e2026" stroke-width="5"/>
      <circle cx="110" cy="110" r="76" fill="#525661" stroke="#2b2e36" stroke-width="3"/>
      <rect x="92" y="92" width="36" height="36" fill="#3a2110" stroke="#1a0e06" stroke-width="2"/>

      <circle cx="1810" cy="110" r="105" fill="#6b707c" stroke="#1e2026" stroke-width="5"/>
      <circle cx="1810" cy="110" r="76" fill="#525661" stroke="#2b2e36" stroke-width="3"/>
      <rect x="1792" y="92" width="36" height="36" fill="#3a2110" stroke="#1a0e06" stroke-width="2"/>

      <circle cx="110" cy="1330" r="105" fill="#6b707c" stroke="#1e2026" stroke-width="5"/>
      <circle cx="110" cy="1330" r="76" fill="#525661" stroke="#2b2e36" stroke-width="3"/>
      <rect x="92" y="1312" width="36" height="36" fill="#3a2110" stroke="#1a0e06" stroke-width="2"/>

      <circle cx="1810" cy="1330" r="105" fill="#6b707c" stroke="#1e2026" stroke-width="5"/>
      <circle cx="1810" cy="1330" r="76" fill="#525661" stroke="#2b2e36" stroke-width="3"/>
      <rect x="1792" y="1312" width="36" height="36" fill="#3a2110" stroke="#1a0e06" stroke-width="2"/>
    </g>

    <!-- South Gatehouse Flanking Towers & Iron Portcullis -->
    <rect x="780" y="1250" width="84" height="190" rx="6" fill="#686d78" stroke="#1e2026" stroke-width="4"/>
    <rect x="1056" y="1250" width="84" height="190" rx="6" fill="#686d78" stroke="#1e2026" stroke-width="4"/>
    <!-- Iron Gate Bars -->
    <rect x="860" y="1338" width="200" height="14" fill="#1f232b" stroke="#090a0d" stroke-width="2"/>
    <g fill="#64748b">
      <circle cx="885" cy="1345" r="4.5"/><circle cx="915" cy="1345" r="4.5"/>
      <circle cx="945" cy="1345" r="4.5"/><circle cx="975" cy="1345" r="4.5"/>
      <circle cx="1005" cy="1345" r="4.5"/><circle cx="1035" cy="1345" r="4.5"/>
    </g>
  </g>

  <!-- Courtyard Wrought-Iron Street Lanterns -->
  <g>
    <circle cx="720" cy="480" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="1200" cy="480" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="720" cy="960" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="1200" cy="960" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="840" cy="1260" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="1080" cy="1260" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="840" cy="180" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
    <circle cx="1080" cy="180" r="9" fill="#fde68a" stroke="#1f232a" stroke-width="3"/>
  </g>

  <!-- Subtle VTT Grid overlay -->
  <rect width="1920" height="1440" fill="url(#castleGrid)" pointer-events="none"/>

  <!-- Dusk Lantern Lighting Pools -->
  <g style="mix-blend-mode: screen;" pointer-events="none">
    <circle cx="720" cy="480" r="240" fill="url(#lanternGlow)"/>
    <circle cx="1200" cy="480" r="240" fill="url(#lanternGlow)"/>
    <circle cx="720" cy="960" r="240" fill="url(#lanternGlow)"/>
    <circle cx="1200" cy="960" r="240" fill="url(#lanternGlow)"/>
    <circle cx="840" cy="1260" r="200" fill="url(#lanternGlow)"/>
    <circle cx="1080" cy="1260" r="200" fill="url(#lanternGlow)"/>
    <circle cx="840" cy="180" r="200" fill="url(#lanternGlow)"/>
    <circle cx="1080" cy="180" r="200" fill="url(#lanternGlow)"/>
  </g>

  <!-- Atmospheric Vignette -->
  <rect width="1920" height="1440" fill="url(#castleVignette)" pointer-events="none"/>
</svg>
