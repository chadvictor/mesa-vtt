<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#42361e"/>
      <stop offset="52%" stop-color="#1e1812"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiteVestment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="55%" stop-color="#dfd5c3"/>
      <stop offset="100%" stop-color="#9e927c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d49b27"/>
      <stop offset="100%" stop-color="#784f0b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f7d5bc"/>
      <stop offset="60%" stop-color="#dba582"/>
      <stop offset="100%" stop-color="#9c684a"/>
    </linearGradient>
    <linearGradient id="chestnutHair" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#854d27"/>
      <stop offset="55%" stop-color="#522c14"/>
      <stop offset="100%" stop-color="#291408"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="62%" stop-color="#070504" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070504" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sunHalo)"/>

  <!-- Sacred Sunburst Halo Ring behind Priestess -->
  <g stroke="url(#gold)" fill="none" opacity="0.58">
    <circle cx="256" cy="204" r="126" stroke-width="2.5"/>
    <circle cx="256" cy="204" r="112" stroke-width="1.2" stroke-dasharray="8 6"/>
    <!-- Radiant rays -->
    <g stroke-width="2">
      <line x1="256" y1="54" x2="256" y2="86"/>
      <line x1="150" y1="98" x2="174" y2="122"/>
      <line x1="362" y1="98" x2="338" y2="122"/>
      <line x1="106" y1="204" x2="138" y2="204"/>
      <line x1="406" y1="204" x2="374" y2="204"/>
    </g>
  </g>

  <!-- Flowing Chestnut Hair & White-Gold Clerical Veil -->
  <path d="M148 186 Q152 94 256 90 Q360 94 364 186 L392 418 L120 418 Z" fill="url(#whiteVestment)" stroke="#7d715c" stroke-width="2.5"/>
  <path d="M168 190 Q174 114 256 110 Q338 114 344 190 L348 370 L164 370 Z" fill="url(#chestnutHair)"/>

  <!-- White-and-Gold Sacred Cleric Vestments -->
  <g>
    <path d="M96 368 Q154 312 256 318 Q358 312 416 368 L448 512 L64 512 Z" fill="url(#whiteVestment)" stroke="#5c5242" stroke-width="3"/>
    <!-- Gold embroidered mantle capelet -->
    <path d="M110 356 Q180 398 256 382 Q332 398 402 356 L418 418 Q332 454 256 436 Q180 454 94 418 Z" fill="#f5efe2" stroke="url(#gold)" stroke-width="4"/>
    <!-- Center ceremonial gold stole -->
    <path d="M222 324 L290 324 L300 512 L212 512 Z" fill="#fef9c3" stroke="url(#gold)" stroke-width="3"/>
    <!-- Glowing Sun Amulet at Chest -->
    <circle cx="256" cy="404" r="28" fill="#fef08a" opacity="0.35"/>
    <circle cx="256" cy="404" r="19" fill="url(#gold)" stroke="#6b440a" stroke-width="2.5"/>
    <circle cx="256" cy="404" r="10" fill="#fffbeb"/>
    <!-- Golden chain -->
    <path d="M214 326 Q256 384 298 326" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Neck & Compassionate Face -->
  <path d="M230 268 L282 268 L286 326 Q256 344 226 326 Z" fill="#dfb08e"/>
  <path d="M192 178 Q192 124 256 124 Q320 124 320 178 L314 232 Q304 276 256 290 Q208 276 198 232 Z" fill="url(#skin)" stroke="#a37052" stroke-width="1.8"/>

  <!-- Golden Forehead Diadem -->
  <path d="M190 162 Q256 178 322 162" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="256" cy="170" r="7" fill="#fffbeb" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Soft Brows & Warm Compassionate Eyes -->
  <path d="M208 190 Q226 182 242 190" fill="none" stroke="#522c14" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M304 190 Q286 182 270 190" fill="none" stroke="#522c14" stroke-width="3.2" stroke-linecap="round"/>

  <path d="M210 206 Q226 196 242 206 Q226 215 210 206 Z" fill="#ffffff"/>
  <circle cx="226" cy="206" r="6.2" fill="#b45309"/>
  <circle cx="226" cy="206" r="2.8" fill="#1c0d04"/>
  <circle cx="228" cy="204" r="1.8" fill="#ffffff"/>
  <path d="M208 206 Q226 195 244 206" fill="none" stroke="#2e180c" stroke-width="2.2"/>

  <path d="M270 206 Q286 196 302 206 Q286 215 270 206 Z" fill="#ffffff"/>
  <circle cx="286" cy="206" r="6.2" fill="#b45309"/>
  <circle cx="286" cy="206" r="2.8" fill="#1c0d04"/>
  <circle cx="288" cy="204" r="1.8" fill="#ffffff"/>
  <path d="M268 206 Q286 195 304 206" fill="none" stroke="#2e180c" stroke-width="2.2"/>

  <!-- Delicate Nose & Warm Gentle Smile -->
  <path d="M256 202 L254 232 L261 234" fill="none" stroke="#b07a5c" stroke-width="2" stroke-linecap="round"/>
  <path d="M236 254 Q256 266 276 254" fill="none" stroke="#a6524b" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Soft Framing Hair Locks & Gold-Trimmed Veil Edge -->
  <path d="M186 182 Q194 126 256 122 Q318 126 326 182 Q294 148 256 146 Q218 148 186 182 Z" fill="url(#chestnutHair)"/>
  <path d="M150 184 Q158 102 256 96 Q354 102 362 184" fill="none" stroke="url(#gold)" stroke-width="4.5"/>

  <!-- Floating Warm Light Motes -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="118" cy="146" r="2.6"/><circle cx="394" cy="154" r="2.6"/>
    <circle cx="146" cy="290" r="2"/><circle cx="372" cy="284" r="2.2"/>
  </g>

  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
