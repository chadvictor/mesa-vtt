<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#451a14"/>
      <stop offset="55%" stop-color="#1e0d0c"/>
      <stop offset="100%" stop-color="#090505"/>
    </radialGradient>
    <radialGradient id="furyGlow" cx="25%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#b91c1c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orcSkin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#6b9446"/>
      <stop offset="55%" stop-color="#466b2c"/>
      <stop offset="100%" stop-color="#263d18"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#785b42"/>
      <stop offset="55%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#21160f"/>
    </linearGradient>
    <linearGradient id="ironBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="62%" stop-color="#050303" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050303" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#furyGlow)"/>

  <!-- Flying Sparks & Battle Smoke -->
  <g fill="#fb923c" opacity="0.75">
    <circle cx="84" cy="112" r="2.8"/><circle cx="142" cy="84" r="2"/>
    <circle cx="420" cy="148" r="2.5"/><circle cx="388" cy="96" r="2"/>
    <circle cx="110" cy="242" r="2.2"/>
  </g>

  <!-- Massive Double-Bitted Greataxe strapped across back -->
  <g transform="translate(384, 190) rotate(26)">
    <rect x="-9" y="-120" width="18" height="330" rx="4" fill="#4a2c16" stroke="#1c0f06" stroke-width="2.5"/>
    <!-- Wicked notched crescent axe blade -->
    <path d="M8 -88 C74 -112, 92 -42, 66 12 C42 -12, 22 -14, 8 -8 Z" fill="url(#ironBlade)" stroke="#0f172a" stroke-width="3"/>
    <path d="M-8 -88 C-74 -112, -92 -42, -66 12 C-42 -12, -22 -14, -8 -8 Z" fill="url(#ironBlade)" stroke="#0f172a" stroke-width="3"/>
    <path d="M68 -80 C84 -52, 82 -20, 66 8" fill="none" stroke="#f8fafc" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Broad Muscular Orc Torso & Thick Wolf-Fur Mantle -->
  <g>
    <!-- Muscular bare chest & leather harness -->
    <path d="M90 368 Q154 294 256 300 Q358 294 422 368 L460 512 L52 512 Z" fill="url(#orcSkin)" stroke="#1b2b11" stroke-width="3"/>
    <!-- Leather bandolier & spiked iron chest buckle -->
    <path d="M138 334 L360 512 L316 512 L114 360 Z" fill="#3d2110" stroke="#1a0d05" stroke-width="2.5"/>
    <circle cx="242" cy="420" r="22" fill="#475569" stroke="#0f172a" stroke-width="3"/>
    <circle cx="242" cy="420" r="9" fill="#94a3b8"/>
    <!-- Thick ragged fur shoulder mantle -->
    <path d="M56 382 Q82 288 182 302 L206 364 L168 386 L132 374 L98 408 L64 402 Z" fill="url(#fur)" stroke="#1c120b" stroke-width="3"/>
    <path d="M456 382 Q430 288 330 302 L306 364 L344 386 L380 374 L414 408 L448 402 Z" fill="url(#fur)" stroke="#1c120b" stroke-width="3"/>
    <!-- Bone fang necklace -->
    <path d="M188 326 Q256 376 324 326" fill="none" stroke="#29170b" stroke-width="5"/>
    <g fill="#ede4d0" stroke="#4a3e2d" stroke-width="1.5">
      <polygon points="212,344 218,368 224,347"/>
      <polygon points="234,352 241,380 248,354"/>
      <polygon points="264,354 271,380 278,352"/>
      <polygon points="288,347 294,368 300,344"/>
    </g>
  </g>

  <!-- Thick Neck & Pointed Orc Ears -->
  <path d="M210 264 L302 264 L310 326 Q256 348 202 326 Z" fill="#3b5c25"/>
  <path d="M180 198 L142 180 L172 228 Z" fill="url(#orcSkin)" stroke="#1e3012" stroke-width="2"/>
  <path d="M332 198 L370 180 L340 228 Z" fill="#375722" stroke="#1b2b11" stroke-width="2"/>
  <!-- Iron ear ring -->
  <circle cx="154" cy="212" r="8" fill="none" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Topknot Dark Braided Hair behind head -->
  <path d="M218 118 Q256 62 294 118 L280 140 L232 140 Z" fill="#181210" stroke="#080605" stroke-width="2"/>
  <rect x="234" y="102" width="44" height="10" rx="3" fill="#991b1b"/>

  <!-- Heavy-Browed Orc Head & Square Jaw -->
  <path d="M178 182 Q178 116 256 116 Q334 116 334 182 L338 242 Q328 292 256 300 Q184 292 174 242 Z" fill="url(#orcSkin)" stroke="#1e3012" stroke-width="2.5"/>
  <!-- Crimson tribal warpaint & battle scar across left eye -->
  <path d="M196 144 L232 238" stroke="#991b1b" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
  <path d="M286 154 L322 176 M288 168 L322 188" stroke="#b91c1c" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

  <!-- Heavy Furrowed Brow Ridge & Fierce Amber Eyes -->
  <path d="M192 178 Q224 170 250 188" fill="none" stroke="#1e3012" stroke-width="9" stroke-linecap="round"/>
  <path d="M320 178 Q288 170 262 188" fill="none" stroke="#1e3012" stroke-width="9" stroke-linecap="round"/>

  <path d="M202 198 Q222 190 242 200 Q222 208 202 198 Z" fill="#1a120a"/>
  <circle cx="224" cy="199" r="6" fill="#f59e0b"/>
  <circle cx="224" cy="199" r="2.6" fill="#0f0905"/>
  <circle cx="226" cy="197" r="1.5" fill="#fef08a"/>

  <path d="M270 200 Q290 190 310 198 Q290 208 270 200 Z" fill="#1a120a"/>
  <circle cx="288" cy="199" r="6" fill="#f59e0b"/>
  <circle cx="288" cy="199" r="2.6" fill="#0f0905"/>
  <circle cx="290" cy="197" r="1.5" fill="#fef08a"/>

  <!-- Broad Flat Nose & Snarling Tusked Jaw -->
  <path d="M240 226 Q256 238 272 226" fill="#324f1f" stroke="#1b2b11" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Snarling open mouth -->
  <path d="M214 256 Q256 244 298 256 Q288 278 256 278 Q224 278 214 256 Z" fill="#2b0d0d" stroke="#17240e" stroke-width="2"/>
  <!-- Lower Ivory Tusks jutting upward -->
  <path d="M214 274 Q206 246 218 228 Q228 248 226 274 Z" fill="#f3ebd8" stroke="#4d412f" stroke-width="2"/>
  <path d="M298 274 Q306 246 294 228 Q284 248 286 274 Z" fill="#f3ebd8" stroke="#4d412f" stroke-width="2"/>
  <!-- Upper teeth glint -->
  <path d="M234 254 L240 262 L246 254 L256 262 L266 254 L272 262 L278 254" fill="#e6dcc6"/>

  <!-- Rim Fire Highlight on Left Jaw & Shoulder -->
  <path d="M180 182 Q176 236 196 278" fill="none" stroke="#fdba74" stroke-width="2.5" opacity="0.5"/>

  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
