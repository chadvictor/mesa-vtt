<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3d2f18"/>
      <stop offset="55%" stop-color="#1b150d"/>
      <stop offset="100%" stop-color="#090706"/>
    </radialGradient>
    <radialGradient id="radiantHalo" cx="50%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#d49b27"/>
      <stop offset="100%" stop-color="#6b440c"/>
    </linearGradient>
    <linearGradient id="silverPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="auburn" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#b44b1e"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f0bfa0"/>
      <stop offset="60%" stop-color="#c98965"/>
      <stop offset="100%" stop-color="#875038"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="62%" stop-color="#060403" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060403" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#radiantHalo)"/>

  <!-- Radiant Sunburst Rays behind Dwarf Paladin -->
  <g stroke="#fde047" stroke-width="2" opacity="0.28">
    <line x1="256" y1="200" x2="256" y2="48"/>
    <line x1="256" y1="200" x2="148" y2="86"/>
    <line x1="256" y1="200" x2="364" y2="86"/>
    <line x1="256" y1="200" x2="96" y2="180"/>
    <line x1="256" y1="200" x2="416" y2="180"/>
  </g>

  <!-- Radiant Warhammer resting behind left shoulder -->
  <g transform="translate(118, 225) rotate(-22)">
    <rect x="-8" y="-20" width="16" height="240" rx="3" fill="#451a03" stroke="#1c0a02" stroke-width="2"/>
    <!-- Massive Dwarven Runic Hammerhead -->
    <path d="M-58 -86 L58 -86 L68 -48 L58 -10 L-58 -10 L-68 -48 Z" fill="url(#silverPlate)" stroke="#1e293b" stroke-width="3"/>
    <rect x="-46" y="-76" width="92" height="56" fill="none" stroke="url(#goldPlate)" stroke-width="4"/>
    <polygon points="0,-68 14,-48 0,-28 -14,-48" fill="#fef08a"/>
  </g>

  <!-- Massive Dwarven Plate Shoulders & Royal Blue/Gold Tabard -->
  <g>
    <!-- Broad stocky armored torso -->
    <path d="M74 374 Q124 294 256 300 Q388 294 438 374 L468 512 L44 512 Z" fill="url(#silverPlate)" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Ornate Gold-Trimmed Heavy Pauldrons -->
    <path d="M58 372 Q86 294 176 310 L190 404 Q114 422 58 430 Z" fill="url(#silverPlate)" stroke="url(#goldPlate)" stroke-width="5"/>
    <path d="M454 372 Q426 294 336 310 L322 404 Q398 422 454 430 Z" fill="url(#silverPlate)" stroke="url(#goldPlate)" stroke-width="5"/>
    <!-- Royal Paladin Tabard -->
    <path d="M188 332 L324 332 L338 512 L174 512 Z" fill="#1e3a8a" stroke="url(#goldPlate)" stroke-width="4"/>
    <!-- Radiant Sun/Anvil Emblem on chest -->
    <circle cx="256" cy="436" r="24" fill="url(#goldPlate)" stroke="#451a03" stroke-width="2"/>
  </g>

  <!-- Sturdy Dwarf Head & Face -->
  <path d="M182 178 Q182 120 256 120 Q330 120 330 178 L328 242 Q320 286 256 296 Q192 286 184 242 Z" fill="url(#skin)" stroke="#6e3c24" stroke-width="2"/>

  <!-- Winged Gold-Trimmed Dwarven Open Helm / Crown Browguard -->
  <path d="M174 178 Q174 102 256 96 Q338 102 338 178 L328 194 Q256 168 184 194 Z" fill="url(#silverPlate)" stroke="#1e293b" stroke-width="3"/>
  <path d="M178 176 Q256 154 334 176" fill="none" stroke="url(#goldPlate)" stroke-width="7"/>
  <!-- Helm nose guard & top crest -->
  <polygon points="248,96 264,96 260,188 252,188" fill="url(#goldPlate)" stroke="#451a03" stroke-width="1.5"/>

  <!-- Bushy Auburn Eyebrows & Noble Eyes -->
  <path d="M196 196 Q220 184 244 196" fill="none" stroke="url(#auburn)" stroke-width="9" stroke-linecap="round"/>
  <path d="M316 196 Q292 184 268 196" fill="none" stroke="url(#auburn)" stroke-width="9" stroke-linecap="round"/>

  <ellipse cx="222" cy="212" rx="14" ry="8" fill="#f8fafc"/>
  <circle cx="223" cy="212" r="5.5" fill="#92400e"/>
  <circle cx="223" cy="212" r="2.6" fill="#0f172a"/>
  <circle cx="225" cy="210" r="1.6" fill="#ffffff"/>

  <ellipse cx="290" cy="212" rx="14" ry="8" fill="#f8fafc"/>
  <circle cx="289" cy="212" r="5.5" fill="#92400e"/>
  <circle cx="289" cy="212" r="2.6" fill="#0f172a"/>
  <circle cx="291" cy="210" r="1.6" fill="#ffffff"/>

  <!-- Broad Dwarven Nose -->
  <path d="M242 232 Q256 246 270 232" fill="#ba7956" stroke="#6e3c24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magnificent Braided Auburn Beard with Golden Beard Clasps -->
  <g>
    <!-- Main full beard volume -->
    <path d="M174 226 Q168 310 202 384 L256 418 L310 384 Q344 310 338 226 Q314 258 256 258 Q198 258 174 226 Z" fill="url(#auburn)" stroke="#361005" stroke-width="2.5"/>
    <!-- Sweeping heroic mustache -->
    <path d="M256 248 Q220 236 184 266 Q216 276 256 266 Q296 276 328 266 Q292 236 256 248 Z" fill="#c25221" stroke="#451506" stroke-width="2"/>
    <!-- Left, Center & Right Braids -->
    <path d="M210 294 Q196 346 206 392 M256 286 L256 412 M302 294 Q316 346 306 392" stroke="#451506" stroke-width="3" fill="none"/>
    <!-- Golden Dwarven Beard Clasps -->
    <rect x="194" y="346" width="24" height="14" rx="3" fill="url(#goldPlate)" stroke="#451a03" stroke-width="2"/>
    <rect x="242" y="366" width="28" height="16" rx="3" fill="url(#goldPlate)" stroke="#451a03" stroke-width="2"/>
    <rect x="294" y="346" width="24" height="14" rx="3" fill="url(#goldPlate)" stroke="#451a03" stroke-width="2"/>
  </g>

  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
