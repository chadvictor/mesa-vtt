<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2d5c"/>
      <stop offset="55%" stop-color="#0f1530"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <radialGradient id="sapphireGlow" cx="76%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="32%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b1128"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4a024"/>
      <stop offset="100%" stop-color="#78500b"/>
    </linearGradient>
    <linearGradient id="elfSkin" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f7e3d4"/>
      <stop offset="60%" stop-color="#e3bfa8"/>
      <stop offset="100%" stop-color="#a88072"/>
    </linearGradient>
    <linearGradient id="silverHair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="48%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="62%" stop-color="#040610" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040610" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Arcane Geometric Halo Behind Head -->
  <g opacity="0.28" stroke="#38bdf8" fill="none">
    <circle cx="256" cy="215" r="138" stroke-width="1.5" stroke-dasharray="10 6"/>
    <circle cx="256" cy="215" r="118" stroke-width="1"/>
    <polygon points="256,82 370,282 142,282" stroke-width="1.2"/>
    <polygon points="256,348 370,148 142,148" stroke-width="1.2"/>
  </g>
  <rect width="512" height="512" fill="url(#sapphireGlow)"/>

  <!-- Flowing Silver Hair Back Layer -->
  <path d="M160 190 Q150 94 256 88 Q362 94 352 190 L374 420 L138 420 Z" fill="url(#silverHair)" stroke="#475569" stroke-width="2"/>

  <!-- Embroidered Midnight Mage Robes & High Arcane Collar -->
  <g>
    <!-- High sculpted collar -->
    <path d="M150 320 Q168 258 214 276 L256 322 L298 276 Q344 258 362 320 L340 374 L172 374 Z" fill="#172554" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- Main robes -->
    <path d="M98 376 Q154 316 256 322 Q358 316 414 376 L446 512 L66 512 Z" fill="url(#robe)" stroke="#090f24" stroke-width="3"/>
    <!-- Gold embroidered sash & lapels -->
    <path d="M210 322 L256 446 L302 322" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M256 446 L256 512" stroke="url(#gold)" stroke-width="4"/>
    <path d="M138 366 Q178 394 214 378 M374 366 Q334 394 298 378" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
    <!-- Sapphire chest brooch -->
    <polygon points="256,374 272,396 256,418 240,396" fill="url(#orbGrad)" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Neck & Pointed High-Elf Ears -->
  <path d="M228 266 L284 266 L288 326 Q256 346 224 326 Z" fill="#dbb49c"/>
  <path d="M188 196 L132 174 L178 228 Z" fill="url(#elfSkin)" stroke="#9e7463" stroke-width="1.8"/>
  <path d="M324 196 L380 174 L334 228 Z" fill="#cfa691" stroke="#8c6556" stroke-width="1.8"/>

  <!-- Slender Aristocratic Elf Face -->
  <path d="M192 174 Q192 122 256 122 Q320 122 320 174 L314 228 Q304 276 256 292 Q208 276 198 228 Z" fill="url(#elfSkin)" stroke="#9e7668" stroke-width="1.8"/>
  <!-- Soft azure reflection on right cheek -->
  <path d="M318 176 L312 228 Q304 266 266 286 Q298 262 304 220 Z" fill="#38bdf8" opacity="0.22"/>

  <!-- Delicate Silver-Gold Circlet with Sapphire Gem -->
  <path d="M192 162 Q256 178 320 162" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <polygon points="256,154 264,168 256,182 248,168" fill="#7dd3fc" stroke="url(#gold)" stroke-width="2"/>

  <!-- Glowing Sapphire Eyes & Arched Brows -->
  <path d="M206 188 Q226 180 242 190" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M306 188 Q286 180 270 190" fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>

  <path d="M208 204 Q225 194 242 204 Q225 213 208 204 Z" fill="#e0f2fe"/>
  <circle cx="226" cy="204" r="6.5" fill="#0ea5e9"/>
  <circle cx="226" cy="204" r="3" fill="#ffffff"/>
  <path d="M206 204 Q225 193 244 204" fill="none" stroke="#1e293b" stroke-width="2.2"/>

  <path d="M270 204 Q287 194 304 204 Q287 213 270 204 Z" fill="#e0f2fe"/>
  <circle cx="286" cy="204" r="6.5" fill="#0ea5e9"/>
  <circle cx="286" cy="204" r="3" fill="#ffffff"/>
  <path d="M268 204 Q287 193 306 204" fill="none" stroke="#1e293b" stroke-width="2.2"/>

  <!-- Nose & Serene Mouth -->
  <path d="M256 196 L253 230 L261 233" fill="none" stroke="#a67c6a" stroke-width="2" stroke-linecap="round"/>
  <path d="M238 254 Q256 260 274 254" fill="none" stroke="#995854" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Front Framing Silver Hair Strands -->
  <path d="M180 184 Q182 110 256 104 Q330 110 332 184 Q314 146 276 140 Q256 136 236 140 Q198 146 180 184 Z" fill="url(#silverHair)"/>
  <path d="M186 168 Q176 238 192 318" fill="none" stroke="url(#silverHair)" stroke-width="14" stroke-linecap="round"/>
  <path d="M326 168 Q336 238 320 318" fill="none" stroke="url(#silverHair)" stroke-width="14" stroke-linecap="round"/>

  <!-- Glowing Sapphire Runic Staff in Right Foreground -->
  <g transform="translate(394, 240) rotate(12)">
    <rect x="-7" y="-20" width="14" height="310" rx="4" fill="#3b2314" stroke="#1c0f08" stroke-width="2"/>
    <!-- Golden crescent staff cradle -->
    <path d="M-26 -18 C-42 -56, -24 -98, 0 -106 C24 -98, 42 -56, 26 -18 Q0 -6 -26 -18 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <!-- Floating glowing sapphire crystal orb -->
    <circle cx="0" cy="-62" r="24" fill="url(#orbGrad)"/>
    <circle cx="0" cy="-62" r="36" fill="#38bdf8" opacity="0.28"/>
    <polygon points="0,-82 12,-62 0,-42 -12,-62" fill="#e0f2fe" opacity="0.7"/>
  </g>

  <!-- Arcane Sparkles -->
  <g fill="#bae6fd" opacity="0.85">
    <circle cx="116" cy="148" r="2.2"/><circle cx="364" cy="108" r="2.8"/>
    <circle cx="430" cy="164" r="2.4"/><circle cx="128" cy="272" r="1.8"/>
  </g>

  <rect width="512" height="512" fill="url(#vignette)" pointer-events="none"/>
</svg>
